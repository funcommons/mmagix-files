<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>站点 v2 · 12 屏原型总览</title>
<link rel="stylesheet" href="tokens.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: var(--paper-deep); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    color: var(--ink);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }

  .page {
    max-width: 1240px;
    margin: 0 auto;
    padding: var(--space-6) var(--space-5) var(--space-6);
  }

  /* —— 头部 —— */
  header { margin-bottom: var(--space-6); }
  header h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
  header .lede { margin-top: var(--space-2); font-size: 14px; color: var(--ink-soft); line-height: 1.7; }
  header .lede a { color: var(--signal); text-decoration: none; border-bottom: 1px solid var(--signal-wash); }
  header .lede a:hover { border-bottom-color: var(--signal); }

  /* —— 缩略卡网格 —— */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
    gap: var(--space-5);
  }
  figure.card {
    background: var(--paper-raised);
    border: 1px solid var(--hairline);
    border-radius: var(--radius);
    box-shadow: var(--shadow-card);
    overflow: hidden;
  }
  .thumb {
    display: block;
    width: 100%;
    aspect-ratio: 1440 / 900;
    object-fit: contain;
    background: var(--paper-deep);
    border-bottom: 1px solid var(--hairline);
  }
  figcaption { padding: var(--space-4) var(--space-4) var(--space-4); }
  figcaption .name { font-size: 15px; font-weight: 700; }
  figcaption .name .no {
    display: inline-block;
    min-width: 34px;
    font-size: 12px; font-weight: 600;
    color: var(--ink-faint);
  }
  figcaption .meta { margin-top: 4px; font-size: 12px; color: var(--ink-faint); }
  figcaption .from {
    margin-top: var(--space-2);
    font-size: 12px; color: var(--ink-soft); line-height: 1.6;
  }
  figcaption .open {
    display: inline-block;
    margin-top: var(--space-3);
    font-size: 13px; font-weight: 600;
    color: var(--signal); text-decoration: none;
  }
  figcaption .open:hover { color: var(--signal-deep); text-decoration: underline; text-underline-offset: 3px; }

  /* —— 页脚 —— */
  footer {
    margin-top: var(--space-6);
    font-size: 12px; color: var(--ink-faint); line-height: 1.8;
  }
  footer a { color: var(--ink-soft); text-decoration: none; border-bottom: 1px solid var(--hairline); }
  footer a:hover { color: var(--signal); border-bottom-color: var(--signal); }

  /* sloplint：动画一律门控；hover 抬升 ≤2px */
  @media (prefers-reduced-motion: no-preference) {
    figure.card { transition: transform 120ms ease, border-color 120ms ease; }
    figure.card:hover { transform: translateY(-1px); border-color: #c9cdd6; }
  }
</style>
</head>
